[project]
name = "mcp-vroid"
version = "0.1.0"
description = "Drive VRoid Studio from any MCP client on Windows or Linux/Wayland"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Nuri Hodges" }]
keywords = [
    "mcp",
    "model-context-protocol",
    "vroid",
    "vrm",
    "gui-automation",
    "hyprland",
    "wayland",
    "3d",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: X11 Applications",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Graphics :: 3D Modeling",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "mcp>=2.0,<3",
    "pillow>=10.0",
    "numpy>=1.26",
    "opencv-python-headless>=4.9",
    "pytesseract>=0.3.10",
    "python-xlib>=0.33; sys_platform == 'linux'",
    "pywin32>=306; sys_platform == 'win32'",
]

[project.scripts]
mcp-vroid = "mcp_vroid.server:main"
vroid-driver = "mcp_vroid.driver.cli:main"

[project.urls]
Homepage = "https://github.com/yub4-arema/mcp-vroid-forWindows"
Repository = "https://github.com/yub4-arema/mcp-vroid-forWindows"
Issues = "https://github.com/yub4-arema/mcp-vroid-forWindows/issues"
Changelog = "https://github.com/yub4-arema/mcp-vroid-forWindows/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_vroid"]
